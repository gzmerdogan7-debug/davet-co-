<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Selin & Emir — Düğün Davetiyesi | DAVET & CO. Zarif</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --text-deep: #3E4430;
      --text-muted: #6B6455;
      --sage: #6B7A5E;
      --sage-deep: #4A5240;
      --terracotta: #B4693E;
      --cream: #F6F1E4;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Jost', sans-serif;
      background-color: #2A2E22;
      background-image: radial-gradient(circle at 50% 50%, #363B29 0%, #181B12 100%);
      color: var(--text-deep);
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }

    .cinema-viewport {
      width: 100%; max-width: 414px; height: 100vh; max-height: 896px;
      position: relative; border-radius: 42px;
      box-shadow: 0 45px 120px -20px rgba(0,0,0,0.98), 0 0 0 1px rgba(255,255,255,0.1);
      overflow: hidden;
      background-color: var(--cream);
      background-image:
        repeating-linear-gradient(90deg, rgba(74,82,64,0.045) 0px, rgba(74,82,64,0.045) 1px, transparent 1px, transparent 2.5px),
        repeating-linear-gradient(0deg, rgba(74,82,64,0.04) 0px, rgba(74,82,64,0.04) 1px, transparent 1px, transparent 2.5px);
    }

    @media (max-width: 640px) {
      .cinema-viewport { max-width: 100%; height: 100vh; max-height: 100%; border-radius: 0; box-shadow: none; }
    }

    .arch-content-box { width: 100%; max-width: 320px; padding: 28px 24px; position: relative; z-index: 25; }

    .story-screen {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 16px 20px 78px 20px; position: relative;
    }

    /* İsim Bloğu */
    .kapak-isim { display: flex; flex-direction: column; align-items: center; }
    .kapak-isim span { font-family: 'Pinyon Script', cursive; color: var(--text-deep); line-height: 1.2; }
    .isim-ilk, .isim-ikinci { font-size: 76px; }
    .ve-satir { font-size: 34px; color: var(--terracotta); margin: -4px 0; }

    .kapak-ekran .isim-ilk, .kapak-ekran .ve-satir, .kapak-ekran .isim-ikinci, .kapak-ekran .kapak-tarih {
      opacity: 0; transform: translateY(14px);
      transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22,1,0.36,1);
    }
    .kapak-ekran.gorundu .isim-ilk { opacity: 1; transform: none; transition-delay: 0.25s; }
    .kapak-ekran.gorundu .ve-satir { opacity: 1; transform: none; transition-delay: 0.75s; }
    .kapak-ekran.gorundu .isim-ikinci { opacity: 1; transform: none; transition-delay: 1.25s; }
    .kapak-ekran.gorundu .kapak-tarih { opacity: 1; transform: none; transition-delay: 1.9s; }

    .kapak-tarih {
      display: block; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400;
      letter-spacing: 0.16em; font-size: 27px; color: var(--terracotta); margin: 92px auto 0;
    }

    .kapak-ekran .arch-content-box {
      opacity: 0; transform: scale(0.88) translateY(22px);
      transition: opacity 1.3s ease, transform 1.3s cubic-bezier(0.16,1,0.3,1);
    }
    .kapak-ekran.gorundu .arch-content-box { opacity: 1; transform: scale(1) translateY(0); }

    /* Botanik Köşe Dalları — AI görseli yerine elle çizilmiş SVG çizgi illüstrasyon */
    .dal {
      position: absolute; width: 130px; height: 130px; z-index: 6; pointer-events: none;
      stroke: var(--sage); fill: none; stroke-width: 1.3; stroke-linecap: round; opacity: 0.85;
    }
    .dal-sol-ust { top: 14px; left: 10px; }
    .dal-sag-alt { bottom: 14px; right: 10px; transform: rotate(180deg); }

    /* Zarf Kapanışı — Aynı çalışan opacity-fade tekniği, yeni botanik yüzey */
    .kapak-overlay {
      position: absolute; inset: 0; z-index: 100; overflow: hidden;
      transition: opacity 2.6s cubic-bezier(0.4,0,0.2,1) 0.5s;
      background: var(--sage-deep);
      background-image: radial-gradient(circle at 50% 45%, #56604A 0%, #414A38 70%, #3A4232 100%);
    }
    .kapak-overlay.acik { opacity: 0; pointer-events: none; }
    .kapak-overlay.acik .zarf-dal { transform: scale(1.06); opacity: 0; }
    .zarf-dal {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      transition: transform 2.6s cubic-bezier(0.4,0,0.2,1) 0.5s, opacity 2s ease 0.5s;
    }
    .zarf-dal svg { width: 78%; stroke: #E9E2CC; fill: none; stroke-width: 1.1; opacity: 0.9; }

    .muhur-dokun {
      position: absolute; left: 50%; top: 46.5%; width: 92px; height: 92px;
      transform: translate(-50%,-50%); border-radius: 50%;
      background: transparent; border: none; padding: 0; cursor: pointer; z-index: 15;
      transition: opacity 0.6s ease;
    }
    .muhur-dokun::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 1.5px solid rgba(233,226,204,0.75); animation: nabiz 2.2s ease-out infinite;
    }
    @keyframes nabiz {
      0% { transform: scale(0.82); opacity: 0.9; }
      70% { transform: scale(1.38); opacity: 0; }
      100% { transform: scale(1.38); opacity: 0; }
    }
    .kapak-overlay.acik .muhur-dokun { opacity: 0; }
  </style>
</head>
<body>

  <div class="cinema-viewport">

    <div id="kapak" class="kapak-overlay">
      <div class="zarf-dal">
        <svg viewBox="0 0 200 200">
          <path d="M100 20 C 95 60, 105 90, 100 180"/>
          <path d="M100 55 C 80 50, 65 60, 55 45"/>
          <path d="M100 55 C 120 50, 135 60, 145 45"/>
          <path d="M100 95 C 78 90, 62 100, 50 88"/>
          <path d="M100 95 C 122 90, 138 100, 150 88"/>
          <path d="M100 135 C 82 130, 68 140, 58 130"/>
          <path d="M100 135 C 118 130, 132 140, 142 130"/>
          <circle cx="55" cy="45" r="3"/>
          <circle cx="145" cy="45" r="3"/>
          <circle cx="50" cy="88" r="3"/>
          <circle cx="150" cy="88" r="3"/>
        </svg>
      </div>
      <button id="acBtn" class="muhur-dokun" aria-label="Davetiyeyi aç"></button>
    </div>

    <svg class="dal dal-sol-ust" viewBox="0 0 130 130">
      <path d="M10 10 C 40 15, 55 35, 60 65"/>
      <path d="M22 22 C 15 30, 18 40, 10 45"/>
      <path d="M35 32 C 42 25, 52 27, 55 20"/>
      <circle cx="10" cy="45" r="2.5"/>
      <circle cx="55" cy="20" r="2.5"/>
    </svg>
    <svg class="dal dal-sag-alt" viewBox="0 0 130 130">
      <path d="M10 10 C 40 15, 55 35, 60 65"/>
      <path d="M22 22 C 15 30, 18 40, 10 45"/>
      <path d="M35 32 C 42 25, 52 27, 55 20"/>
      <circle cx="10" cy="45" r="2.5"/>
      <circle cx="55" cy="20" r="2.5"/>
    </svg>

    <div id="story-slider">
      <section class="story-screen kapak-ekran">
        <div class="arch-content-box text-center">
          <div class="kapak-isim">
            <span class="isim-ilk">Selin</span>
            <span class="ve-satir">&amp;</span>
            <span class="isim-ikinci">Emir</span>
          </div>
          <span class="kapak-tarih">18.10.2026</span>
        </div>
      </section>
    </div>

  </div>

  <script>
    document.getElementById('acBtn').addEventListener('click', function () {
      document.getElementById('kapak').classList.add('acik');
      const kapakEkrani = document.querySelector('.kapak-ekran');
      if (kapakEkrani) { setTimeout(function () { kapakEkrani.classList.add('gorundu'); }, 2700); }
      setTimeout(function () { document.getElementById('kapak').remove(); }, 3300);
    }, { once: true });
  </script>

</body>
</html>
