<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İpek & Kaan Davetiye</title>
    <!-- Google Fonts: Lüks ve Zarif Font (Cormorant Garamond) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    
    <style>
        /* Genel Stil ve Font Tanımı */
        body {
            font-family: 'Cormorant Garamond', serif;
            margin: 0;
            padding: 0;
            background-color: #fdfcfb;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- ZARF AÇILIŞ EKRANI -->
    <div id="zarfKapağı" style="
        position: fixed; 
        top: 0; left: 0; width: 100%; height: 100%; 
        background-color: #fdfcfb; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        z-index: 9999; 
        transition: opacity 1.5s ease-out, visibility 1.5s;
        cursor: pointer;
    ">
        <div style="text-align: center; position: relative; padding: 20px;">
            
            <div style="font-size: 4rem; color: #cbb472; margin-bottom: 15px;">✉️</div>

            <h2 style="
                font-family: 'Cormorant Garamond', serif; 
                color: #444; 
                font-weight: 300; 
                font-size: 1.8rem;
                letter-spacing: 4px; 
                margin-bottom: 25px;
                text-transform: uppercase;
            ">
                Sizi Bu Özel Güne Davet Ediyoruz
            </h2>
            
            <div style="
                margin-top: 20px;
                display: inline-block;
                padding: 12px 35px;
                background-color: #cbb472; 
                color: white;
                font-family: 'Cormorant Garamond', serif;
                font-size: 1.1rem;
                letter-spacing: 2px;
                border-radius: 30px;
                box-shadow: 0 4px 15px rgba(203,180,114,0.3);
                text-transform: uppercase;
            ">
                Mührü Kaldır
            </div>
            
            <p style="font-size: 0.9rem; color: #889; margin-top: 15px; font-style: italic;">(veya ekrana dokununuz)</p>
        </div>
    </div>

    <script>
        // Zarfı Tıklayınca Açılmasını Sağlayan Kod
        document.getElementById('zarfKapağı').addEventListener('click', function() {
            this.style.opacity = '0';
            this.style.visibility = 'hidden';
        });
    </script>

    <!-- ASIL DAVETİYE İÇERİĞİN BURAYA GELECEK -->
    <div style="text-align: center; padding: 100px 20px;">
        <h1 style="font-size: 3rem; font-weight: 300; letter-spacing: 2px;">İpek & Kaan</h1>
        <p style="font-size: 1.2rem; font-style: italic; color: #666;">Zarfı açarak davetiyenizi görüntülediniz. Harika gidiyoruz!</p>
    </div>

</body>
</html>
